<IfModule mod_ssl.c>
<VirtualHost *:443>
        ServerName sso.test.com
        ServerAdmin root@localhost
        DocumentRoot /var/www/html

        # don't lose time with IP address lookups
        HostnameLookups Off
        # needed for named virtual hosts
        UseCanonicalName Off

        ProxyPreserveHost On
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"
        ProxyPass / http://localhost:8080/
        ProxyPassReverse / http://localhost:8080/

        ProxyRequests Off

        SecRuleEngine On
        SecRule ARGS:triggerparam "@contains trigger" "id:1234,deny,status:403,msg:'Our trigger rule has triggered'"

        <LocationMatch "(/auth/admin/|/auth/realms/master/)$">
                deny from all
                allow from x.x.x.x

                AuthType Basic
                AuthName "SSO Admin protection"
                AuthUserFile /path/sso/.htpasswd
                require valid-user
        </LocationMatch>

        <LocationMatch "/auth/admin">
                SecRuleRemoveById 911100
                SecRuleRemoveById 949110
                SecRuleRemoveById 980130
        </LocationMatch>

        ErrorLog /var/log/apache2/keycloaktestcom.log
        LogLevel warn
        CustomLog /var/log/apache2/keycloaktestcom.log combined
        ServerSignature Off

SSLCertificateFile /etc/letsencrypt/live/sso.test.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/sso.test.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>