---

- name: APT Upgrade hosts and kernel cloud
  hosts: "all"
  serial: 1
  become: true

  tasks:

    - name: Run "apt-get update" if the last one is more than 3600 seconds ago
      ansible.builtin.apt:
        update_cache: true

    - name: Run "apt-get upgrade" and pass options to dpkg
      ansible.builtin.apt:
        upgrade: true
        update_cache: true
        dpkg_options: 'force-confold,force-confdef'

    - name: Install gpg,cron,locales-all,linux-image-cloud-amd64
      ansible.builtin.apt:
        update_cache: true
        pkg:
          - gpg
          - cron
          - locales-all
          - linux-image-cloud-amd64

    - name: Remove dependencies that are no longer required.
      ansible.builtin.apt:
        autoremove: true

    - name: Check if a reboot is required.
      ansible.builtin.stat:
        path: /var/run/reboot-required
        get_checksum: false
      register: reboot_required_file

    - name: Reboot the server
      ansible.builtin.reboot:
      when: reboot_required_file.stat.exists == true
