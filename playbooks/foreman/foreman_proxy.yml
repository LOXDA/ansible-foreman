# There is an omapi bug after isc-dhcp-server_4.4.1-2+deb10u1 (Debian 10 Buster) run with --tags tfm,fixdhcp
- hosts: tfm_proxy
  gather_facts: true
  become: true
  tasks:
    - name: fix isc-dhcp-server omapi bug with debian >10
      block:
      - name: Download libirs-export161 package from Buster
        ansible.builtin.apt:
          deb: http://cdn-fastly.deb.debian.org/debian/pool/main/b/bind9-libs/libirs-export161_9.11.19+dfsg-2.1_amd64.deb
      - name: Download libssl1 package from Buster
        ansible.builtin.apt:
          deb: http://security.debian.org/debian-security/pool/updates/main/o/openssl/libssl1.1_1.1.1n-0+deb10u6_amd64.deb
      - name: Download libisc-export1100 package from Buster
        ansible.builtin.apt:
          deb: http://cdn-fastly.deb.debian.org/debian-security/pool/main/b/bind9/libisc-export1100_9.11.5.P4+dfsg-5.1+deb10u11_amd64.deb
      - name: Install libdns-export1104 package from Buster
        ansible.builtin.apt:
          deb: http://cdn-fastly.deb.debian.org/debian-security/pool/main/b/bind9/libdns-export1104_9.11.5.P4+dfsg-5.1+deb10u11_amd64.deb
      - name: Download isc-dhcp-server package from Buster
        get_url:
          url: http://cdn-fastly.deb.debian.org/debian/pool/main/i/isc-dhcp/isc-dhcp-server_4.4.1-2+deb10u1_amd64.deb
          dest: /tmp/isc-dhcp-server_4.4.1-2+deb10u1_amd64.deb
      - name: Fix install isc-dhcp-server version
        command: dpkg --force-downgrade --force-hold -i /tmp/isc-dhcp-server_4.4.1-2+deb10u1_amd64.deb
      - name: Hold isc-dhcp-server
        dpkg_selections: name=isc-dhcp-server selection=hold
      - name: Restart service isc-dhcp-server
        service: name=isc-dhcp-server state=restarted
      when: ansible_distribution == 'Debian' and "ansible_distribution_version" >= "10"
  tags:
    - never
    - fixdhcp

- hosts: tfm_proxy
  gather_facts: true
  become: true
  roles:
    - icinga.icinga.repos
    - icinga.icinga.icinga2
  tags:
    - never
    - monitoring
