  - name: Hosts users
    description: Role granting permissions to view hosts.
    locations: OPN
    organizations: OPN
    state: present
    filters: 
      - permissions:
        - view_architectures
        search: ""
      - permissions:
        - view_domains
        search: ""
      - permissions:
        - view_hosts
        search: hostgroup_title ~ OPN
      - permissions:
        - view_media
        search: name ~ "Debian" or name ~ "Windows" or name ~ "ESXi"
      - permissions:
        - view_operatingsystems
        search: name ~ "Debian" or name ~ "Windows" or name ~ "ESXi"
      - permissions:
        - view_ptables
        search: name = "Preseed default LVM" or name = "Windows default partition table" or name = "Kickstart default"
      - permissions:
        - view_provisioning_templates
        search: ""
      - permissions:
        - view_subnets
        search: ""

  - name: Hosts admins
    description: Role granting permissions to manage hosts.
    locations: OPN
    organizations: OPN
    state: present
    filters: 
      - permissions:
        - view_architectures
        search: ""
      - permissions:
        - view_domains
        search: ""
      - permissions:
        - view_hosts
        - create_hosts
        - edit_hosts
        - destroy_hosts
        - build_hosts
        - console_hosts
        - forget_status_hosts
        - power_hosts
        search: hostgroup_title ~ OPN
      - permissions:
        - view_config_reports
      - permissions:
        - view_params
        search: ""
      - permissions:
        - view_media
        search: name ~ "Debian" or name ~ "Windows" or name ~ "ESXi"
      - permissions:
        - view_operatingsystems
        search: name ~ "Debian" or name ~ "Windows" or name ~ "ESXi"
      - permissions:
        - view_ptables
        search: name = "Preseed default LVM" or name = "Windows default partition table" or name = "Kickstart default"
      - permissions:
        - view_provisioning_templates
        search: ""
      - permissions:
        - view_subnets
        search: ""

  - name: Hosts admins LAB1
    description: Role granting permissions to manage hosts.
    locations: OPN
    organizations: OPN
    state: present
    filters: 
      - permissions:
        - view_architectures
        search: ""
      - permissions:
        - view_domains
        search: ""
      - permissions:
        - view_hosts
        - create_hosts
        - edit_hosts
        - destroy_hosts
        - build_hosts
        - console_hosts
        - forget_status_hosts
        - power_hosts
        search: hostgroup_title ~ OPN and usergroup = LAB1
      - permissions:
        - view_config_reports
      - permissions:
        - view_params
        search: ""
      - permissions:
        - view_media
        search: name ~ "Debian" or name ~ "Windows" or name ~ "ESXi"
      - permissions:
        - view_operatingsystems
        search: name ~ "Debian" or name ~ "Windows" or name ~ "ESXi"
      - permissions:
        - view_ptables
        search: name = "Preseed default LVM" or name = "Windows default partition table" or name = "Kickstart default"
      - permissions:
        - view_provisioning_templates
        search: ""
      - permissions:
        - view_subnets
        search: ""

